<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 930" width="1200" height="930" role="img" aria-labelledby="title desc">
  <title id="title">OfCourse on Google Cloud</title>
  <desc id="desc">The browser calls one Cloud Run service. Inside it, the content pipeline runs Extractor, Drafter, Source checker, Illustrator, Art checker, Localiser and Captioner, with three human checkpoints: the editor picks a version, the editor picks a cover, a reviewer approves and publishes. The model layer calls Gemini models on Agent Platform (Vertex AI) at location global. Data lives in Cloud SQL for PostgreSQL 17, secrets in Secret Manager; each model call becomes a Cloud Trace span, a Cloud Logging line and billing labels. Cloud Build and Artifact Registry build and store the image.</desc>
  <style>
    svg { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .bg { fill: #ffffff; }
    .t { fill: #1f2328; font-size: 12px; }
    .m { fill: #59636e; font-size: 12px; }
    .h { fill: #1f2328; font-size: 13px; font-weight: 600; }
    .h2 { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .title { fill: #1f2328; font-size: 22px; font-weight: 700; }
    .box { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1; }
    .gcp { fill: none; stroke: #1a73e8; stroke-width: 1.5; }
    .gcpfill { fill: #f0f6ff; stroke: #1a73e8; stroke-width: 1.5; }
    .code { fill: #f1f3f4; stroke: #9aa0a6; stroke-width: 1; }
    .model { fill: #fef7e0; stroke: #e8a600; stroke-width: 1.2; }
    .human { fill: #e6f4ea; stroke: #188038; stroke-width: 2; }
    .humant { fill: #137333; font-size: 13px; font-weight: 700; }
    .tag { fill: #8a5a00; font-size: 12px; font-weight: 600; }
    .line { stroke: #57606a; stroke-width: 1.4; fill: none; }
    .dash { stroke: #57606a; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #57606a; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; font-size: 11.5px; fill: #1f2328; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .t, .h, .h2, .title, .mono { fill: #e6edf3; }
      .m { fill: #9198a1; }
      .box { fill: #161b22; stroke: #3d444d; }
      .gcp { stroke: #8ab4f8; }
      .gcpfill { fill: #0f1b2d; stroke: #8ab4f8; }
      .code { fill: #21262d; stroke: #6e7681; }
      .model { fill: #2e2408; stroke: #d4a72c; }
      .human { fill: #0f2a19; stroke: #57ab5a; }
      .humant { fill: #7ee2a0; }
      .tag { fill: #e3b341; }
      .line, .dash { stroke: #9198a1; }
      .head { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="930"/>

  <text class="title" x="24" y="40">OfCourse on Google Cloud</text>
  <text class="m" x="24" y="64">The request path, the model behind each agent, the data stores and the three human checkpoints. Solid arrows carry requests and data; dashed arrows carry telemetry.</text>

  <!-- Browser -->
  <rect class="box" x="24" y="96" width="180" height="360" rx="8"/>
  <text class="h2" x="40" y="122">Browser · HTTPS</text>
  <rect class="code" x="36" y="136" width="156" height="92" rx="6"/>
  <text class="h" x="48" y="156">Student</text>
  <text class="t" x="48" y="174">sign-in: Google or</text>
  <text class="t" x="48" y="190">an email code</text>
  <text class="t" x="48" y="206">onboarding, /futures,</text>
  <text class="t" x="48" y="222">/attention, /feed</text>
  <rect class="code" x="36" y="240" width="156" height="92" rx="6"/>
  <text class="h" x="48" y="260">Editor, reviewer</text>
  <text class="t" x="48" y="278">/admin/sign-in (Google)</text>
  <text class="t" x="48" y="294">the board, the post</text>
  <text class="t" x="48" y="310">workbench, page styles</text>
  <rect class="code" x="36" y="344" width="156" height="92" rx="6"/>
  <text class="h" x="48" y="364">Anyone</text>
  <text class="t" x="48" y="382">/posts/&lt;slug&gt;, no</text>
  <text class="t" x="48" y="398">sign-in, in the</text>
  <text class="t" x="48" y="414">sitemap</text>

  <!-- Browser to Cloud Run -->
  <path class="line" d="M204,286 L234,286" marker-end="url(#arrow)"/>

  <!-- Build and deploy -->
  <rect class="gcpfill" x="24" y="490" width="180" height="66" rx="8"/>
  <text class="h" x="36" y="512">Cloud Build</text>
  <text class="t" x="36" y="530">builds our Dockerfile from</text>
  <text class="t" x="36" y="546">gcloud run deploy --source</text>
  <path class="line" d="M114,556 L114,578" marker-end="url(#arrow)"/>
  <rect class="gcpfill" x="24" y="580" width="180" height="66" rx="8"/>
  <text class="h" x="36" y="602">Artifact Registry</text>
  <text class="t" x="36" y="620">stores the image</text>
  <text class="t" x="36" y="636">(Node 24, standalone)</text>
  <path class="line" d="M204,613 L234,613" marker-end="url(#arrow)"/>
  <path class="line" d="M114,646 L114,668" marker-end="url(#arrow)"/>
  <rect class="gcpfill" x="24" y="670" width="180" height="66" rx="8"/>
  <text class="h" x="36" y="692">Cloud Run job</text>
  <text class="t" x="36" y="710">runs the migrations from</text>
  <text class="t" x="36" y="726">the same image</text>
  <path class="line" d="M114,736 L114,834 L234,834" marker-end="url(#arrow)"/>

  <!-- Cloud Run service -->
  <rect class="gcp" x="236" y="96" width="600" height="652" rx="10"/>
  <text class="h2" x="252" y="122">Cloud Run · service ofcourse</text>
  <text class="m" x="252" y="140">Next.js 16 on Node 24 · server actions return results, never throw · long steps run after the response</text>

  <rect class="code" x="252" y="152" width="184" height="70" rx="6"/>
  <text class="h" x="262" y="171">Sign-in and roles</text>
  <text class="t" x="262" y="188">Better Auth: Google, email</text>
  <text class="t" x="262" y="204">code · editor and reviewer</text>
  <text class="t" x="262" y="218">rights checked in one module</text>
  <rect class="code" x="444" y="152" width="184" height="70" rx="6"/>
  <text class="h" x="454" y="171">Student opening</text>
  <text class="t" x="454" y="188">answers saved on every tap</text>
  <text class="t" x="454" y="204">three futures from rules in</text>
  <text class="t" x="454" y="218">code: no model call</text>
  <rect class="code" x="636" y="152" width="184" height="70" rx="6"/>
  <text class="h" x="646" y="171">Feed and public pages</text>
  <text class="t" x="646" y="188">serve only what a reviewer</text>
  <text class="t" x="646" y="204">approved · public pages are</text>
  <text class="t" x="646" y="218">rate-limited</text>

  <!-- Content pipeline -->
  <rect class="box" x="244" y="236" width="584" height="316" rx="8"/>
  <text class="h" x="252" y="256">Content pipeline · the editor chooses and edits, and never writes a prompt</text>

  <!-- row 1 -->
  <rect class="code" x="252" y="270" width="124" height="56" rx="6"/>
  <text class="h" x="262" y="288">Source or link</text>
  <text class="t" x="262" y="304">code numbers each</text>
  <text class="t" x="262" y="319">sentence, ¶2.3</text>
  <path class="line" d="M376,298 L398,298" marker-end="url(#arrow)"/>
  <rect class="model" x="400" y="270" width="124" height="56" rx="6"/>
  <text class="h" x="410" y="288">Extractor</text>
  <text class="t" x="410" y="304">points at the facts</text>
  <text class="tag" x="410" y="319">3.8 Flash</text>
  <path class="line" d="M524,298 L546,298" marker-end="url(#arrow)"/>
  <rect class="model" x="548" y="270" width="124" height="56" rx="6"/>
  <text class="h" x="558" y="288">Drafter</text>
  <text class="t" x="558" y="304">three versions</text>
  <text class="tag" x="558" y="319">3.8 Flash</text>
  <path class="line" d="M672,298 L694,298" marker-end="url(#arrow)"/>
  <rect class="human" x="696" y="270" width="124" height="56" rx="6"/>
  <text class="humant" x="706" y="288">Checkpoint 1</text>
  <text class="t" x="706" y="304">editor picks one</text>
  <text class="t" x="706" y="319">version and edits it</text>
  <path class="line" d="M758,326 L758,337 L314,337 L314,346" marker-end="url(#arrow)"/>

  <!-- row 2 -->
  <rect class="model" x="252" y="348" width="124" height="56" rx="6"/>
  <text class="h" x="262" y="366">Source checker</text>
  <text class="t" x="262" y="382">meaning vs. its fact</text>
  <text class="tag" x="262" y="397">Flash-Lite</text>
  <path class="line" d="M376,376 L398,376" marker-end="url(#arrow)"/>
  <rect class="model" x="400" y="348" width="124" height="56" rx="6"/>
  <text class="h" x="410" y="366">Illustrator</text>
  <text class="t" x="410" y="382">three covers</text>
  <text class="tag" x="410" y="397">Nano Banana 2.1</text>
  <path class="line" d="M524,376 L546,376" marker-end="url(#arrow)"/>
  <rect class="model" x="548" y="348" width="124" height="56" rx="6"/>
  <text class="h" x="558" y="366">Art checker</text>
  <text class="t" x="558" y="382">no text in the art</text>
  <text class="tag" x="558" y="397">Flash-Lite</text>
  <path class="line" d="M672,376 L694,376" marker-end="url(#arrow)"/>
  <rect class="human" x="696" y="348" width="124" height="56" rx="6"/>
  <text class="humant" x="706" y="366">Checkpoint 2</text>
  <text class="t" x="706" y="382">editor picks</text>
  <text class="t" x="706" y="397">a cover</text>
  <path class="line" d="M758,404 L758,415 L314,415 L314,424" marker-end="url(#arrow)"/>

  <!-- row 3 -->
  <rect class="model" x="252" y="426" width="124" height="56" rx="6"/>
  <text class="h" x="262" y="444">Localiser</text>
  <text class="t" x="262" y="460">money by code</text>
  <text class="tag" x="262" y="475">Flash-Lite</text>
  <path class="line" d="M376,454 L398,454" marker-end="url(#arrow)"/>
  <rect class="code" x="400" y="426" width="124" height="56" rx="6"/>
  <text class="h" x="410" y="444">Feed settings</text>
  <text class="t" x="410" y="460">layer, audience,</text>
  <text class="t" x="410" y="475">tags, expiry</text>
  <path class="line" d="M524,454 L546,454" marker-end="url(#arrow)"/>
  <rect class="human" x="548" y="426" width="124" height="56" rx="6"/>
  <text class="humant" x="558" y="444">Checkpoint 3</text>
  <text class="t" x="558" y="460">reviewer approves</text>
  <text class="t" x="558" y="475">and publishes</text>
  <path class="line" d="M672,454 L694,454" marker-end="url(#arrow)"/>
  <rect class="code" x="696" y="426" width="124" height="56" rx="6"/>
  <text class="h" x="706" y="444">Live</text>
  <text class="t" x="706" y="460">/feed and</text>
  <text class="t" x="706" y="475">/posts/&lt;slug&gt;</text>
  <path class="line" d="M758,482 L758,492" marker-end="url(#arrow)"/>

  <!-- row 4: after live -->
  <rect class="code" x="696" y="494" width="124" height="48" rx="6"/>
  <text class="h" x="706" y="513">Make the set</text>
  <text class="t" x="706" y="530">one per page brand</text>
  <path class="line" d="M696,518 L674,518" marker-end="url(#arrow)"/>
  <rect class="model" x="400" y="494" width="272" height="48" rx="6"/>
  <text class="h" x="410" y="513">Captioner · hook and call to action</text>
  <text class="t" x="410" y="530">the body is the post's checked lines · <tspan class="tag">Flash-Lite</tspan></text>
  <path class="line" d="M400,518 L378,518" marker-end="url(#arrow)"/>
  <rect class="code" x="252" y="494" width="124" height="48" rx="6"/>
  <text class="h" x="262" y="513">Export zip</text>
  <text class="t" x="262" y="530">SVG, PNG, caption</text>

  <!-- Code decides -->
  <rect class="code" x="252" y="566" width="568" height="84" rx="6"/>
  <text class="h" x="264" y="586">Code decides what can be checked</text>
  <text class="t" x="264" y="604">Facts are exact source sentences; numbers and money are compared and converted in code.</text>
  <text class="t" x="264" y="621">The layout engine draws every word (opentype.js measures, resvg draws); fit checks gate it.</text>
  <text class="t" x="264" y="638">Every answer passes its schema, then code checks; problems go back to the model in the retry.</text>

  <!-- Model layer -->
  <rect class="code" x="252" y="662" width="568" height="72" rx="6"/>
  <text class="h" x="264" y="681">Model layer · src/features/content/ai</text>
  <text class="t" x="264" y="699">cache in Postgres → attempt → retry with the problems → Pro · daily caps on Pro and image</text>
  <text class="t" x="264" y="716">provider: Agent Platform, or a fake (tests) and exact-match replays (demos)</text>
  <text class="t" x="264" y="730">each call: one span, one JSON log line, billing labels</text>

  <!-- Model layer to Agent Platform -->
  <path class="line" d="M820,680 L852,680 L852,330 L870,330" marker-end="url(#arrow)"/>

  <!-- Agent Platform -->
  <rect class="gcp" x="872" y="96" width="304" height="468" rx="10"/>
  <text class="h2" x="888" y="122">Agent Platform (Vertex AI)</text>
  <text class="m" x="888" y="140">generateContent at location global, through</text>
  <text class="m" x="888" y="154">@google/genai · a service account, no API key</text>

  <rect class="model" x="888" y="166" width="272" height="88" rx="6"/>
  <text class="mono" x="900" y="186">gemini-3.5-flash-lite · lite</text>
  <text class="t" x="900" y="205">Source checker · Art checker</text>
  <text class="t" x="900" y="222">Captioner · Localiser's rewording</text>
  <text class="t" x="900" y="239">Style reader (a page's design language)</text>

  <rect class="model" x="888" y="264" width="272" height="88" rx="6"/>
  <text class="mono" x="900" y="284">gemini-3.8-flash · flash</text>
  <text class="t" x="900" y="303">Extractor · Drafter (three versions,</text>
  <text class="t" x="900" y="320">another take on one slide) · low thinking</text>
  <text class="t" x="900" y="337">second rung for the lite steps</text>

  <rect class="model" x="888" y="362" width="272" height="88" rx="6"/>
  <text class="mono" x="900" y="382">gemini-3.1-pro-preview · pro</text>
  <text class="t" x="900" y="401">last rung of every retry ladder</text>
  <text class="t" x="900" y="418">after two failed attempts</text>
  <text class="t" x="900" y="435">capped per UTC day</text>

  <rect class="model" x="888" y="460" width="272" height="88" rx="6"/>
  <text class="mono" x="900" y="480">gemini-nano-banana-2.1 · image</text>
  <text class="t" x="900" y="499">Illustrator: covers, with a page's</text>
  <text class="t" x="900" y="516">reference images as style references</text>
  <text class="t" x="900" y="533">capped per UTC day</text>

  <!-- Billing labels -->
  <path class="dash" d="M1024,564 L1024,584" marker-end="url(#arrow)"/>
  <rect class="gcpfill" x="872" y="586" width="304" height="66" rx="8"/>
  <text class="h" x="888" y="608">Cloud Billing reports</text>
  <text class="t" x="888" y="626">labels on every call: app, use_case, tier,</text>
  <text class="t" x="888" y="642">prompt_version, env (never a user)</text>

  <!-- Secret Manager -->
  <rect class="gcpfill" x="872" y="670" width="304" height="78" rx="8"/>
  <text class="h" x="888" y="692">Secret Manager</text>
  <text class="t" x="888" y="710">database URL and password, auth secret,</text>
  <text class="t" x="888" y="726">Google sign-in client id and secret,</text>
  <text class="t" x="888" y="742">given to the service when it starts</text>
  <path class="line" d="M872,720 L838,720" marker-end="url(#arrow)"/>

  <!-- Data and telemetry -->
  <path class="line" d="M386,748 L386,782" marker-end="url(#arrow)"/>
  <rect class="gcpfill" x="236" y="784" width="300" height="100" rx="8"/>
  <text class="h" x="250" y="806">Cloud SQL for PostgreSQL 17</text>
  <text class="t" x="250" y="824">accounts, roles, student answers</text>
  <text class="t" x="250" y="840">posts as immutable records, images</text>
  <text class="t" x="250" y="856">ai_call log (daily caps), ai_cache,</text>
  <text class="t" x="250" y="872">page styles · over the Unix socket</text>

  <path class="dash" d="M652,748 L652,782" marker-end="url(#arrow)"/>
  <rect class="gcpfill" x="552" y="784" width="200" height="100" rx="8"/>
  <text class="h" x="566" y="806">Cloud Trace</text>
  <text class="t" x="566" y="824">a gen_ai span per attempt:</text>
  <text class="t" x="566" y="840">model, tokens, use case,</text>
  <text class="t" x="566" y="856">outcome; no text</text>
  <text class="t" x="566" y="872">on when OTEL_ENABLED=1</text>

  <path class="dash" d="M800,748 L800,782" marker-end="url(#arrow)"/>
  <rect class="gcpfill" x="768" y="784" width="200" height="100" rx="8"/>
  <text class="h" x="782" y="806">Cloud Logging</text>
  <text class="t" x="782" y="824">one JSON line per call:</text>
  <text class="t" x="782" y="840">use case, tier, model,</text>
  <text class="t" x="782" y="856">tokens, outcome, ms</text>
  <text class="t" x="782" y="872">no prompt, no answer</text>

  <!-- Legend -->
  <rect class="box" x="988" y="784" width="188" height="100" rx="8"/>
  <rect class="human" x="1000" y="798" width="18" height="12" rx="2"/>
  <text class="t" x="1026" y="809">a person decides</text>
  <rect class="model" x="1000" y="820" width="18" height="12" rx="2"/>
  <text class="t" x="1026" y="831">a Gemini call</text>
  <rect class="code" x="1000" y="842" width="18" height="12" rx="2"/>
  <text class="t" x="1026" y="853">our code only</text>
  <rect class="gcpfill" x="1000" y="864" width="18" height="12" rx="2"/>
  <text class="t" x="1026" y="875">Google Cloud service</text>

  <text class="m" x="24" y="914">Retry ladders: a lite step tries Flash-Lite, then Flash, then Pro; a Flash step tries Flash twice, then Pro. A cover with text in its art is drawn again once, else it is not used.</text>
</svg>
