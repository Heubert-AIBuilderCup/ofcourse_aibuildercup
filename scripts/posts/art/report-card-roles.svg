<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="540" viewBox="0 0 1080 540">
  <title>Report card for life after university: five roles, three empty rows, no grades</title>
  <!-- Card two, after university: the roles, three empty rows, the same key, no grades at all. Drawn in ink and white: the Pop tint shows ink as deep blue and white as yellow. -->
  <rect width="1080" height="540" fill="#16191B"/>
  <rect x="60" y="24" width="960" height="494" fill="#FFFFFF" stroke="#16191B" stroke-width="6"/>
  <rect x="60" y="24" width="960" height="62" fill="#FFFFFF" stroke="#16191B" stroke-width="6"/>
  <text x="84" y="69" font-family="Barlow Condensed" font-weight="700" font-size="40" fill="#16191B" text-anchor="start">REPORT CARD</text>
  <text x="84" y="118" font-family="Barlow Condensed" font-weight="700" font-size="28" fill="#16191B" text-anchor="start">Role</text>
  <text x="687.5" y="118" font-family="Barlow Condensed" font-weight="700" font-size="28" fill="#16191B" text-anchor="middle">1</text>
  <text x="782.5" y="118" font-family="Barlow Condensed" font-weight="700" font-size="28" fill="#16191B" text-anchor="middle">2</text>
  <text x="877.5" y="118" font-family="Barlow Condensed" font-weight="700" font-size="28" fill="#16191B" text-anchor="middle">3</text>
  <text x="972.5" y="118" font-family="Barlow Condensed" font-weight="700" font-size="28" fill="#16191B" text-anchor="middle">4</text>
  <g stroke="#16191B" stroke-width="3">
    <line x1="60" y1="132" x2="1020" y2="132"/>
    <line x1="60" y1="172" x2="1020" y2="172"/>
    <line x1="60" y1="212" x2="1020" y2="212"/>
    <line x1="60" y1="252" x2="1020" y2="252"/>
    <line x1="60" y1="292" x2="1020" y2="292"/>
    <line x1="60" y1="332" x2="1020" y2="332"/>
    <line x1="60" y1="372" x2="1020" y2="372"/>
    <line x1="60" y1="412" x2="1020" y2="412"/>
    <line x1="60" y1="452" x2="1020" y2="452"/>
    <line x1="640" y1="86" x2="640" y2="452"/>
    <line x1="735" y1="86" x2="735" y2="452"/>
    <line x1="830" y1="86" x2="830" y2="452"/>
    <line x1="925" y1="86" x2="925" y2="452"/>
  </g>
  <text x="84" y="160" font-family="Barlow" font-weight="400" font-size="26" fill="#16191B" text-anchor="start">Husband</text>
  <text x="84" y="200" font-family="Barlow" font-weight="400" font-size="26" fill="#16191B" text-anchor="start">Son</text>
  <text x="84" y="240" font-family="Barlow" font-weight="400" font-size="26" fill="#16191B" text-anchor="start">Dog parent</text>
  <text x="84" y="280" font-family="Barlow" font-weight="400" font-size="26" fill="#16191B" text-anchor="start">Product Manager</text>
  <text x="84" y="320" font-family="Barlow" font-weight="400" font-size="26" fill="#16191B" text-anchor="start">Citizen</text>
  <text x="540" y="494" font-family="Barlow" font-weight="400" font-size="22" fill="#16191B" text-anchor="middle">A = Excellent · B = Good · C = Satisfactory · N = Needs Improvement</text>
</svg>
