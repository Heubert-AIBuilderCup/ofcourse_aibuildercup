  <text x="687.5" y="160" font-family="Barlow Condensed" font-weight="700" font-size="28" fill="#16191B" text-anchor="middle">A</text>
  <text x="84" y="200" font-family="Barlow" font-weight="400" font-size="26" fill="#16191B" text-anchor="start">Professional Communication</text>
  <text x="687.5" y="200" font-family="Barlow Condensed" font-weight="700" font-size="28" fill="#16191B" text-anchor="middle">A</text>
